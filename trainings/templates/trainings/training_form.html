{% extends "base.html" %}

{% block content %}

<div class="row">
    <div class="col-md-4">
        <form method="post" class="basic-form" enctype="multipart/form-data">
            <h2>{% if form.instance.pk %}Izmeni trening{% else %}Dodaj novi trening{% endif %}</h2>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Sačuvaj</button>
        </form>
    </div>
</div>

{% endblock %}
